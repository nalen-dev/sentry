[workspace]
resolver = "2"
members = ["crates/shared", "crates/api", "crates/agent"]
# Desktop (Tauri) tetap berdiri sendiri, tidak ikut workspace cloud.
exclude = ["app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
