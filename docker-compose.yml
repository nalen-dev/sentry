version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: sentry_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dts}
      POSTGRES_USER: ${POSTGRES_USER:-dts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DtsSecureDbPass2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dts_user} -d ${POSTGRES_DB:-dts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: sentry_api
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dts_user}:${POSTGRES_PASSWORD:-DtsSecureDbPass2026}@db:5432/${POSTGRES_DB:-dts}
      BIND_ADDR: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: sentry_web
    restart: always
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
